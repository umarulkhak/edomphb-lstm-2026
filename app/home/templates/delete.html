{% extends "base-site.html" %}
{% block title %}Hapus pengguna{% endblock %}
{% block content %}
<main class="my-3 my-md-5">
  <div class="container">
    <section class="card mx-auto" style="max-width: 600px;">
      <div class="card-header"><h1 class="card-title">Hapus akun pengguna</h1></div>
      <div class="card-body">
        <p>Anda akan menghapus akun <strong>{{ user.nama }}</strong> ({{ user.username }}). Tindakan ini tidak dapat dibatalkan.</p>
        <form method="post" action="{{ url_for('base_blueprint.deleteuser', id=user.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <a class="btn btn-outline-dark" href="{{ url_for('base_blueprint.datauser') }}">Batal</a>
          <button class="btn btn-danger ml-2" type="submit">Hapus akun</button>
        </form>
      </div>
    </section>
  </div>
</main>
{% endblock %}
